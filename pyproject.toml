[project]
name = "readmission-mlops"
version = "0.1.0"
description = "Running the readmission risk model as a monitored service: MLflow, FastAPI, Docker, CI/CD and drift monitoring."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enock Mulenga" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "mlflow>=3.18.0",
    "pyyaml>=6.0",
    "readmission-risk",
    "skops>=0.16",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readmission_mlops"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W pycodestyle (PEP 8), F pyflakes, I isort, B bugbear, UP pyupgrade,
# N naming, SIM simplify, D docstrings (Google style).
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D100", "D104"]  # module/package docstrings optional

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: slower tests that touch databases, APIs or files"]

[tool.uv.sources]
readmission-risk = { git = "https://github.com/MulengaSnr/readmission-risk-model", rev = "v1.0" }
